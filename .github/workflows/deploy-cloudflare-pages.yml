# WARISAN SUARA - Auto Deploy to Cloudflare Pages
# Triggers on push to main branch, builds static frontend, deploys to Pages
# Requires GitHub Secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Setup Prisma
        run: |
          bun run db:generate

      - name: Build static frontend for Cloudflare Pages
        env:
          DEPLOY_TARGET: cloudflare-pages
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
        run: |
          # Move API routes temporarily (replaced by Pages Functions in production)
          mv src/app/api /tmp/api-dev-backup
          bun run build || true
          # Restore API routes
          mv /tmp/api-dev-backup src/app/api

      - name: Verify build output
        run: |
          if [ -d "out" ]; then
            echo "✓ Static build successful: $(ls out/ | wc -l) files"
            du -sh out/
          else
            echo "✗ Build failed - no out/ directory"
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy out/ --project-name warisan-suara --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post-deploy health check
        run: |
          sleep 10
          curl -s -o /dev/null -w "Homepage: HTTP %{http_code}\n" https://warisan-suara.pages.dev/
          curl -s https://warisan-suara.pages.dev/api/health | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Health: {d.get(\"status\")} | AI: {d.get(\"aiProvider\")}')"
          echo "✓ Deployment verified at https://warisan-suara.pages.dev"
